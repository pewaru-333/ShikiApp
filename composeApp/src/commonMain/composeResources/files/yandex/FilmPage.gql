query FilmPage($contentUuid: String!, $isAuthorized: Boolean!, $withPrechosenEpisode: Boolean!, $episodeNumber: Int!, $seasonNumber: Int!, $withUserData: Boolean!, $socialArgumentLimit: Int!, $includeSocialArgumentTypes: [ReactionType!]!) {
  movieByContentUuid(contentUuid: $contentUuid) {
    id
    contentId
    ...TicketOption
    ...AgeRestriction
    ...OverviewMeta
    ...ContentOverview
    ...ContentDetails
    ...ContentCard
    ...MovieSocial @include(if: $isAuthorized)
    ...SerialStructure
    ...MovieSeoMeta
    ...PrechosenEpisode @include(if: $withPrechosenEpisode)
    ...MainTrailer
    ...Promo
    ...OttNextEpisode @include(if: $isAuthorized)
    ...OttMovieTiming @include(if: $isAuthorized)
    ...MovieType
    __typename
  }
  ...MovieWebPage
}

fragment TicketOptionPurchasableValues on TicketOption {
  purchasable
  __typename
}

fragment ReleaseAnnounceIncompleteDate on ReleaseAnnounce {
  releaseDate {
    accuracy
    date
    __typename
  }
  __typename
}

fragment TicketOptionReleaseAnnounceValues on TicketOption {
  releaseAnnounce {
    available
    ...ReleaseAnnounceIncompleteDate
    __typename
  }
  __typename
}

fragment TicketOptionValues on TicketOption {
  ...TicketOptionPurchasableValues
  ...TicketOptionReleaseAnnounceValues
  __typename
}

fragment RatingValue on RatingValue {
  value
  isActive
  count
  __typename
}

fragment OttPreviewFeatures on OttPreview {
  features(filter: {layout: OTT_TITLE_CARD, onlyClientSupported: true}) {
    alias
    displayedName: displayName
    group
    __typename
  }
  __typename
}

fragment AvailabilityViewOption on ViewOption {
  watchabilityStatus
  availabilityAnnounce {
    __typename
  }
  __typename
}

fragment Years on Movie {
  __typename
  ... on VideoInterface {
    productionYear(override: OTT_WHEN_EXISTS)
    __typename
  }
  ... on Series {
    releaseYears {
      start
      end
      __typename
    }
    __typename
  }
}

fragment MovieRatingListItem on MovieInList {
  movieListSlug
  position
  __typename
}

fragment MovieRatingLists on Movie {
  ratingLists {
    top10 {
      ...MovieRatingListItem
      __typename
    }
    top250 {
      ...MovieRatingListItem
      __typename
    }
    __typename
  }
  __typename
}

fragment AudioMeta on AudioMeta {
  forAdult
  language
